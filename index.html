<!doctype html>

<body class="bg-slate-50 font-sans text-slate-900 antialiased selection:bg-violet-200 dark:bg-slate-950 dark:text-slate-100">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-24 focus:top-3 focus:z-50 focus:rounded-lg focus:bg-violet-700 focus:p-3 focus:text-white">Skip to content</a>
  <aside class="fixed inset-y-0 left-0 z-20 flex w-16 flex-col border-r border-slate-800 bg-slate-900 px-2 py-7 text-slate-300 md:w-20 md:px-3 lg:w-60 lg:px-5">
    <a href="#dashboard" aria-label="AgentHub dashboard" class="mb-12 flex items-center gap-3 rounded-lg px-1 focus-visible:outline focus-visible:outline-2 focus-visible:outline-violet-400"><span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-violet-600 font-bold text-white">A<span class="text-violet-300">↗</span></span><span class="hidden text-xl font-semibold tracking-tight text-white lg:block">AgentHub<span class="mt-0.5 block text-xs font-normal tracking-normal text-slate-400">Admin workspace</span></span></a>
    <nav id="navigation" aria-label="Main navigation" class="space-y-2"></nav>
    <div class="mt-auto pt-8"><div class="mb-5 hidden rounded-xl border border-slate-700 p-4 lg:block"><p class="text-sm font-medium text-white">A workspace for AI.</p><p class="mt-2 text-xs leading-5 text-slate-400">Everything your agents need.<br>All in one place.</p></div><button id="reset" aria-label="Reset demo data" title="Reset demo data" class="flex w-full items-center justify-center gap-2 rounded-lg p-2 text-xs text-slate-400 hover:bg-slate-800 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-violet-400"><span aria-hidden="true">↺</span><span class="hidden lg:inline">Reset demo data</span></button><div class="mt-5 flex items-center justify-center gap-3 border-t border-slate-700 pt-5 lg:justify-start"><span class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-700 text-xs font-semibold text-white" aria-hidden="true">AH</span><div class="hidden lg:block"><p class="text-sm text-white">Admin workspace</p><p class="text-xs text-slate-400">Fictional demo</p></div></div></div>
  </aside>
  <div class="ml-16 min-h-screen md:ml-20 lg:ml-60">

    <main id="main" tabindex="-1" class="mx-auto max-w-[1600px] p-5 focus:outline-none md:p-9 lg:p-10"></main>
    <footer class="px-5 pb-6 text-xs text-slate-500 dark:text-slate-400 md:px-9 lg:px-10">AgentHub prototype <span aria-hidden="true">·</span> Fictional records. Changes stay in this session.</footer>

  <dialog id="modal" aria-labelledby="modal-title" class="m-auto max-h-[85vh] w-[calc(100%-2rem)] max-w-xl overflow-y-auto rounded-2xl border border-slate-200 bg-white p-0 text-slate-900 shadow-2xl backdrop:bg-slate-950/60 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100"><div class="p-6 sm:p-8"><div class="mb-6 flex items-start justify-between gap-4"><h2 id="modal-title" class="text-xl font-semibold tracking-tight"></h2><button data-close aria-label="Close dialog" class="-mr-2 -mt-2 rounded-lg p-2 text-slate-500 hover:bg-slate-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-violet-500 dark:text-slate-400 dark:hover:bg-slate-800">✕</button></div><div id="modal-content"></div></div></dialog>
  <div id="notice" role="status" aria-live="polite" class="pointer-events-none fixed bottom-5 right-5 z-50 max-w-[calc(100%-6rem)] rounded-xl bg-slate-900 px-5 py-3 text-sm text-white shadow-lg empty:hidden dark:bg-slate-100 dark:text-slate-900"></div>
